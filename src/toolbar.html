<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tech Browser</title>
    <link rel="stylesheet" href="toolbar.css">
  </head>
  <body>
    <main class="toolbar" aria-label="Browser-Werkzeugleiste">
      <button id="back" type="button" title="Zurück" aria-label="Zurück">&#x2190;</button>
      <button id="forward" type="button" title="Vorwärts" aria-label="Vorwärts">&#x2192;</button>
      <button id="reload" type="button" title="Neu laden" aria-label="Neu laden">&#x21bb;</button>
      <button id="home" type="button" title="Leere Seite" aria-label="Leere Seite">&#x2302;</button>
      <form id="address-form" autocomplete="off">
        <input id="address" type="text" inputmode="url" aria-label="Adresse oder Suchbegriff" placeholder="Adresse oder Suchbegriff" spellcheck="false">
      </form>
      <span id="status" role="status" aria-live="polite"></span>
    </main>
    <script src="toolbar.js"></script>
  </body>
</html>
